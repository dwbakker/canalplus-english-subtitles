<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i></div>

  <header class="glass head">
    <div class="glyph" aria-hidden="true">EN</div>
    <div class="titles">
      <h1>English Subtitles</h1>
      <p>for CANAL+</p>
    </div>
    <label class="switch" title="Enable or disable">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <section class="glass card">
    <h2>Translator</h2>
    <div class="seg" data-key="provider">
      <span class="thumb"></span>
      <button data-v="claude">Claude</button>
      <button data-v="apple">Apple</button>
    </div>

    <div id="claudeOpts">
      <div class="seg small" data-key="claudeModel">
        <span class="thumb"></span>
        <button data-v="claude-opus-5-5" title="Best quality">Opus</button>
        <button data-v="claude-sonnet-5-5">Sonnet</button>
        <button data-v="claude-haiku-5-5" title="Cheapest, about $0.01 an episode">Haiku</button>
      </div>
      <div class="keyrow">
        <input type="password" id="apiKey" placeholder="Anthropic API key" autocomplete="off" spellcheck="false">
        <button id="save" class="pill accent">Save</button>
      </div>
      <p class="hint">Natural, context-aware translations. The key stays in this browser.</p>
    </div>

    <div id="appleOpts" hidden>
      <p class="hint">Free and private: translated on your Mac by Apple's built-in translator. Needs the Mac app version of the extension.</p>
    </div>
  </section>

  <section class="glass card">
    <h2>Show</h2>
    <div class="seg" data-key="display">
      <span class="thumb"></span>
      <button data-v="track">English</button>
      <button data-v="track-dual" title="French on top, English below">FR + EN</button>
      <button data-v="overlay" title="Drawn over the page; not shown in Safari's native fullscreen">Overlay</button>
    </div>
    <h2>From French subtitles</h2>
    <div class="seg small" data-key="source">
      <span class="thumb"></span>
      <button data-v="auto" title="The most complete French track">Automatic</button>
      <button data-v="standard">Standard</button>
      <button data-v="sdh" title="For the deaf and hard of hearing (DST/SME); sound descriptions are removed">Deaf &amp; HoH</button>
    </div>
  </section>

  <footer>
    <button id="clear" class="pill">Clear cache</button>
    <button id="reload" class="pill" title="After npm run build: reload the extension from its folder">Reload</button>
    <span id="msg" role="status"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
